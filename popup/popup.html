<!-- popup/popup.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>YouTube to Obsidian</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #2e3338;
            --text-muted: #6e7681;
            --input-bg: #f8f9fa;
            --input-border: #d0d7de;
            --input-focus: #e46643;
            --chip-bg: #f1f3f5;
            --chip-text: #495057;
            --chip-border: #e9ecef;
            --chip-active-bg: #fdeee9;
            --chip-active-text: #c0392b;
            --chip-active-border: #e46643;
            --btn-bg: #e46643;
            --btn-hover: #d35400;
            --btn-disabled: #cbd5e1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1e1e24;
                --text-color: #e2e8f0;
                --text-muted: #94a3b8;
                --input-bg: #2b2b36;
                --input-border: #3f3f4e;
                --input-focus: #ff7849;
                --chip-bg: #2b2b36;
                --chip-text: #cbd5e1;
                --chip-border: #3f3f4e;
                --chip-active-bg: #3d2319;
                --chip-active-text: #ff8a65;
                --chip-active-border: #e46643;
                --btn-bg: #e46643;
                --btn-hover: #d35400;
                --btn-disabled: #475569;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 320px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--chip-border);
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .tags-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-color);
        }

        .tags-hint {
            font-size: 11px;
            color: var(--text-muted);
        }

        .tags-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .tags-input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 2px rgba(228, 102, 67, 0.2);
        }

        .section-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .chip {
            background: var(--chip-bg);
            color: var(--chip-text);
            border: 1px solid var(--chip-border);
            border-radius: 12px;
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .chip:hover {
            border-color: var(--input-focus);
        }

        .chip.active {
            background: var(--chip-active-bg);
            color: var(--chip-active-text);
            border-color: var(--chip-active-border);
            font-weight: 600;
        }

        .btn {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.15s ease;
        }

        .btn:hover {
            background: var(--btn-hover);
        }

        .btn:disabled {
            background: var(--btn-disabled);
            cursor: not-allowed;
        }

        .status {
            font-size: 12px;
            text-align: center;
            min-height: 16px;
            color: var(--text-muted);
        }

        .status.success {
            color: #27ae60;
            font-weight: 500;
        }

        .status.error {
            color: #e74c3c;
            font-weight: 500;
        }

        .transcript-group {
            margin-top: 2px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label .label-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-color);
        }

        .custom-checkbox, .sub-checkbox {
            accent-color: var(--btn-bg);
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 4px;
            background: var(--chip-bg);
            color: var(--text-muted);
            border: 1px solid var(--chip-border);
        }

        .transcript-suboptions {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            padding: 8px 10px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .suboption-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sub-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-color);
            cursor: pointer;
            user-select: none;
        }

        .language-row {
            padding-top: 4px;
            border-top: 1px dashed var(--chip-border);
        }

        .sub-hint {
            font-size: 11px;
            color: var(--text-muted);
        }

        .lang-select {
            padding: 3px 6px;
            font-size: 11px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
            cursor: pointer;
        }

        .lang-select:focus {
            border-color: var(--input-focus);
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="header-title">YouTube to Obsidian</span>
    </div>

    <div class="container">
        <div class="form-group">
            <div class="label-row">
                <label for="tagsInput" class="tags-label">Tags</label>
                <span class="tags-hint">comma-separated</span>
            </div>
            <input 
                type="text" 
                id="tagsInput" 
                class="tags-input" 
                placeholder="e.g. tutorial, ai, dev" 
                autocomplete="off"
                list="tagSuggestions"
            >
            <datalist id="tagSuggestions"></datalist>
        </div>

        <div class="form-group" id="templatesGroup">
            <span class="section-label">Templates</span>
            <div id="templatesList" class="chips-container"></div>
        </div>

        <div class="form-group" id="recentTagsGroup" style="display: none;">
            <span class="section-label">Recent Tags</span>
            <div id="recentTagsList" class="chips-container"></div>
        </div>

        <div class="form-group transcript-group">
            <div class="toggle-row">
                <label for="includeTranscript" class="checkbox-label">
                    <input type="checkbox" id="includeTranscript" class="custom-checkbox" checked>
                    <span class="label-text">Include Transcript</span>
                </label>
                <span id="transcriptStatusBadge" class="badge">Auto</span>
            </div>

            <div id="transcriptOptions" class="transcript-suboptions">
                <div class="suboption-row">
                    <label for="includeTimestamps" class="sub-label">
                        <input type="checkbox" id="includeTimestamps" class="sub-checkbox" checked>
                        <span>Timestamps</span>
                    </label>
                    <label for="collapsibleTranscript" class="sub-label">
                        <input type="checkbox" id="collapsibleTranscript" class="sub-checkbox" checked>
                        <span>Collapsible</span>
                    </label>
                </div>
                <div class="suboption-row language-row">
                    <span class="sub-hint">Language:</span>
                    <select id="preferredLang" class="lang-select">
                        <option value="auto">Auto (Default)</option>
                        <option value="en">English</option>
                        <option value="pt">Portuguese</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                    </select>
                </div>
            </div>
        </div>

        <button id="saveBtn" class="btn">Save Video to Obsidian</button>
        <div id="status" class="status"></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
